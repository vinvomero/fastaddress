name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo test --workspace --features fastaddress-py/model-v2
        name: model-v2 feature path (feature stays default-off; CI exercises it explicitly)
      - run: cargo build --release -p fastaddress-core --bins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r benchmark/requirements.txt maturin
      - run: maturin build --release -m crates/python/Cargo.toml
      - run: pip install --no-deps target/wheels/*.whl
      - run: python benchmark/dump_oracle.py && python benchmark/run_parity.py --dump-bin target/release/dump
        name: four-layer parity gate
      - run: python crates/python/tests/test_dropin.py
      - run: python crates/python/tests/test_model_select.py
      - name: model-v2 feature wheel branch
        run: |
          maturin build --release -m crates/python/Cargo.toml --features model-v2 -o dist-v2
          pip install --force-reinstall --no-deps dist-v2/*.whl
          python crates/python/tests/test_model_select.py

  build-wheels:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m crates/python/Cargo.toml -o dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: wheel install + import smoke
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import fastaddress; t, k = fastaddress.tag('123 N Main St Springfield IL 62704'); assert k == 'Street Address', k; print('wheel OK:', t)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist
