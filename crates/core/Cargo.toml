[package]
name = "usaddr-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rust engine for US address parsing, running the usaddress CRF model with output parity"

[features]
# Compiles in the v2 model and its selection paths. Stays OFF until the
# model-v2 plan's go/no-go gate enables it (plan R8).
model-v2 = []

[dependencies]
crfs = { path = "../crf" }
regex = "1"
csv = "1"
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
rustc-hash = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
