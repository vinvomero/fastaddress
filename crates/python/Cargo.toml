[package]
name = "usaddr-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Drop-in usaddress-compatible US address parser backed by a Rust engine"

[lib]
name = "usaddr"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
usaddr-core = { path = "../core" }
