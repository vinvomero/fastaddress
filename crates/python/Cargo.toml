[package]
name = "fastaddress-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Drop-in usaddress-compatible US address parser backed by a Rust engine"
repository = "https://github.com/vinvomero/fastaddress"
homepage = "https://github.com/vinvomero/fastaddress"

[lib]
name = "fastaddress"
crate-type = ["cdylib"]

[features]
# Forwards to the core crate's v2 model embedding. Stays OFF by default until
# the model-v2 plan's go/no-go gate flips it (plan U8); without it,
# model="v2" raises ValueError at runtime.
model-v2 = ["fastaddress-core/model-v2"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
fastaddress-core = { path = "../core", package = "fastaddress-core" }
