[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "usaddr"
version = "0.1.0"
description = "Drop-in usaddress-compatible US address parser backed by a Rust engine (exact output parity, dramatically faster)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "usaddr"
